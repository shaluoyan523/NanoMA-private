[project]
name = "nanoma"
version = "0.9.1"
description = "Minimal multi-agent harness"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.4",
]

[project.scripts]
nanoma = "nanoma.main:cli"

[tool.setuptools]
packages = ["nanoma"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
