[project]
name = "nanoma"
version = "0.10.0"
description = "General-purpose agent runtime with autonomous per-node planning"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.scripts]
nanoma = "nanoma.main:cli"

[tool.setuptools]
packages = ["nanoma", "nanoma.plugins", "nanoma.plugins.workspace_tools"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
